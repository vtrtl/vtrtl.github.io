<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const textToDisplay = "I love you";
        const particles = [];
        const particleCount = 350;
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * 15, y: -y * 15 };
        }
        class Particle {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.fontSize = Math.floor(Math.random() * 6) + 12;
                this.speed = Math.random() * 0.03 + 0.02;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.driftX = (Math.random() - 0.5) * 10;
                this.driftY = (Math.random() - 0.5) * 10;
            }
            update(scale) {
                const actualTargetX = (canvas.width / 2) + (this.targetX * scale) + this.driftX;
                const actualTargetY = (canvas.height / 2) + (this.targetY * scale) + this.driftY;
                this.x += (actualTargetX - this.x) * this.speed;
                this.y += (actualTargetY - this.y) * this.speed;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 75, 110, ${this.opacity})`;
                ctx.font = `bold ${this.fontSize}px Arial`;
                ctx.fillText(textToDisplay, this.x, this.y);
            }
        }
        for (let i = 0; i < particleCount; i++) {
            const t = (i / particleCount) * Math.PI * 2;
            const point = getHeartPoint(t);
            particles.push(new Particle(point.x, point.y));
        }
        let time = 0;
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            time += 0.05;
            const heartScale = 1 + Math.sin(time * 2) * 0.08; 
            particles.forEach(particle => {
                particle.update(heartScale);
                particle.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
