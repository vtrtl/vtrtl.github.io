<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Ethics Simulator</title>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #1e293b;
  }

  .container {
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .panel {
    width: 90%;
    max-width: 850px;
    background: #111827;
    padding: 20px;
    border-radius: 15px;
  }

  label {
    display: block;
    margin-top: 10px;
    color: #cbd5e1;
  }

  input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 5px;
  }

  button {
    margin-top: 15px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #2563eb;
  }

  .toggle {
    margin-top: 15px;
    padding: 10px;
    background: #1e293b;
    border-radius: 10px;
  }

  .result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #1e293b;
  }

  .explain {
    margin-top: 10px;
    font-size: 14px;
    color: #cbd5e1;
  }

  .processing {
    display: none;
    margin-top: 10px;
    font-style: italic;
    color: #94a3b8;
  }
</style>
</head>

<body>

<header>
  <h1>AI Moral Information Processing Simulator</h1>
</header>

<div class="container">
<div class="panel">

  <label>Choose System</label>
  <select id="scenario" onchange="updateForm()">
    <option value="hiring">AI Hiring System</option>
    <option value="privacy">Data Collection System</option>
    <option value="social">Social Media Algorithm</option>
    <option value="facial">Facial Recognition System</option>
  </select>

  <div id="formArea"></div>

  <div class="toggle">
    <label>
      <input type="checkbox" id="ethicalMode" checked>
      Ethical Mode ON
    </label>
  </div>

  <button onclick="runSystem()">Submit Data</button>

  <div class="processing" id="processing">System processing...</div>

  <div class="result">
    <h3>Decision</h3>
    <p id="decision">No decision yet</p>

    <button onclick="explainDecision()">Explain Decision</button>
    <div class="explain" id="explanation"></div>
  </div>

</div>
</div>

<script>

let lastDecision = "";
let currentScenario = "";
let ethical = true;

function updateForm() {
  let s = document.getElementById("scenario").value;
  currentScenario = s;
  let form = document.getElementById("formArea");

  if (s === "hiring") {
    form.innerHTML = `
      <label>Age</label>
      <input id="age" type="number">

      <label>Experience (years)</label>
      <input id="exp" type="number">
    `;
  }

  if (s === "privacy") {
    form.innerHTML = `
      <label>Email</label>
      <input id="email" type="text">

      <label>Interest</label>
      <input id="interest" type="text">
    `;
  }

  if (s === "social") {
    form.innerHTML = `
      <label>Search Topic</label>
      <input id="topic" type="text">
    `;
  }

  if (s === "facial") {
    form.innerHTML = `
      <label>Location</label>
      <input id="location" type="text">
    `;
  }
}

updateForm();

function runSystem() {
  document.getElementById("processing").style.display = "block";
  document.getElementById("explanation").innerText = "";
  ethical = document.getElementById("ethicalMode").checked;

  setTimeout(() => {
    if (currentScenario === "hiring") {
      let age = document.getElementById("age").value;
      let exp = document.getElementById("exp").value;

      if (ethical) {
        lastDecision = exp >= 2 ? "Accepted" : "Rejected";
      } else {
        lastDecision = age < 25 ? "Accepted" : "Rejected";
      }
    }
    if (currentScenario === "privacy") {
      let interest = document.getElementById("interest").value;

      if (ethical) {
        lastDecision = "Data stored securely";
      } else {
        lastDecision = "Data sold → ads about " + interest;
      }
    }
    if (currentScenario === "social") {
      let topic = document.getElementById("topic").value;

      if (ethical) {
        lastDecision = "Balanced content about " + topic;
      } else {
        lastDecision = "Extreme content promoted for engagement";
      }
    }
    if (currentScenario === "facial") {
      let location = document.getElementById("location").value;

      if (ethical) {
        lastDecision = "Used with consent in " + location;
      } else {
        lastDecision = "Tracking without consent in " + location;
      }
    }

    document.getElementById("decision").innerText = lastDecision;
    document.getElementById("processing").style.display = "none";

  }, 1000);
}

function explainDecision() {

  if (currentScenario === "hiring") {
    document.getElementById("explanation").innerText =
      ethical
      ? "Decision based on relevant experience."
      : "Decision influenced by age bias.";
  }

  if (currentScenario === "privacy") {
    document.getElementById("explanation").innerText =
      ethical
      ? "User data is protected and not shared."
      : "User data is sold without consent.";
  }

  if (currentScenario === "social") {
    document.getElementById("explanation").innerText =
      ethical
      ? "Algorithm promotes accurate information."
      : "Algorithm prioritises engagement over truth.";
  }

  if (currentScenario === "facial") {
    document.getElementById("explanation").innerText =
      ethical
      ? "Used responsibly with permission."
      : "Violates privacy through surveillance.";
  }
}

</script>

</body>
</html>
